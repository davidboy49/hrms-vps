# QAS site. Install as /etc/nginx/sites-available/hrs-qas (symlink into sites-enabled).
# Needs /etc/nginx/snippets/cloudflare-real-ip.conf and /etc/nginx/conf.d/cloudflare-geo.conf (deploy/qas/gen-cloudflare-nginx.sh).
server {
    listen 80;
    listen [::]:80;
    server_name hrs-qas.neakra.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hrs-qas.neakra.com;

    ssl_certificate /etc/letsencrypt/live/hrs-qas.neakra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrs-qas.neakra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # the real visitor address (from Cloudflare), so login limits and the audit log see people, not Cloudflare
    include snippets/cloudflare-real-ip.conf;
    # only Cloudflare may talk to this site: the Cloudflare login gate (Access) cannot be bypassed by calling the server directly
    if ($from_cloudflare = 0) { return 444; }

    client_max_body_size 20m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
