# Checks every pull request. Every merge to main is checked again and then deployed to the VPS over SSH.
# Setup: deploy/README.md, "Automatic deploy".
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button, to deploy main again by hand

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Build (type check)
        run: npm run build
        env:
          # the build only needs these to exist
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DATABASE_URL_UNPOOLED: postgresql://build:build@localhost:5432/build
          AUTH_SECRET: build-only-secret-build-only-secret-0000
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # one deploy at a time; a newer merge waits instead of cancelling a deploy half way
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # The key on the server is limited to one command (deploy/deploy.sh), so nothing else is run here.
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" deploy
