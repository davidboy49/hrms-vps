name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every pull request and push. A deploy only starts if this passes, so a type or lint error never reaches the server.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # generates the route types (LayoutProps and friends) that tsc needs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      # every server action, route and page must check who is calling (see scripts/check-guards.mjs)
      - run: npm run check:guards

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    # One deploy at a time; a newer push waits for the running one instead of cancelling it mid-build.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          # The key on the VPS is locked to deploy/update.sh, so no command is passed here.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST"

  # Tells the team on Telegram when a push to main fails its checks or its deploy. Pull requests stay quiet.
  notify:
    needs: [check, deploy]
    if: always() && github.event_name != 'pull_request' && (needs.check.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
          WHAT: ${{ needs.check.result == 'failure' && 'Checks failed (nothing was deployed)' || 'Deploy to the VPS failed' }}
          COMMIT: ${{ github.event.head_commit.message || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS --max-time 15 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=❌ HRMS: ${WHAT}
          ${COMMIT%%$'\n'*}
          ${RUN_URL}" >/dev/null
