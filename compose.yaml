# PeopleDesk on one VPS: app + Postgres + private photo storage (RustFS) + Caddy for HTTPS.
# Only Caddy publishes ports (80 and 443). The database and storage are reachable only from the other containers.
# Copy deploy/env.example to .env, fill it in, then:  docker compose up -d --build

x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peopledesk
      POSTGRES_DB: peopledesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopledesk -d peopledesk"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logs

  # private photo storage: RustFS, an S3-compatible store (the volume keeps its old name "miniodata" so existing photos stay)
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    user: "0:0"
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logs

  # creates the private "uploads" bucket once, then exits
  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs: { condition: service_healthy }
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c", "aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket uploads 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket uploads"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rustfs-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://peopledesk:${POSTGRES_PASSWORD}@db:5432/peopledesk?schema=public
      DATABASE_URL_UNPOOLED: postgresql://peopledesk:${POSTGRES_PASSWORD}@db:5432/peopledesk?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      ADMS_TOKEN: ${ADMS_TOKEN:-}
      AWS_ENDPOINT_URL_S3: http://rustfs:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *logs

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logs

  # live log viewer for every container; reachable only from the server itself (use an SSH tunnel, see deploy/README.md)
  dozzle:
    image: amir20/dozzle@sha256:a7d69d20891d3dcc82636e24afa4c1c162b41d0673ef798b14f09e6b69accc5a
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8080:8080"
    logging: *logs

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
